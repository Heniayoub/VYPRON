<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYPRON</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap">
<header><div class="brand">VYPRON <span>◆</span></div><button id="logout" class="secondary hidden">خروج</button></header>
<section id="auth" class="panel"><h1>VYPRON</h1><p>لوحة إدارة الخدمات والعملاء</p><div class="form"><input id="email" type="email" placeholder="الإيميل" autocomplete="email"><input id="password" type="password" placeholder="كلمة السر" autocomplete="current-password"><div class="row"><button id="signin">دخول</button><button id="signup" class="secondary">إنشاء حساب</button></div><p id="authmsg" class="note"></p></div></section>
<section id="dashboard" class="hidden">
<div class="hero"><small>لوحة التحكم</small><h1>مرحبا بيك في VYPRON</h1><p>إدارة العملاء، الخدمات، الطلبات والاشتراكات.</p></div>
<nav><button data-tab="overview" class="active">الرئيسية</button><button data-tab="clients">العملاء</button><button data-tab="agents">الوكلاء</button><button data-tab="services">الخدمات</button><button data-tab="orders">الطلبات</button><button data-tab="subs">الاشتراكات</button></nav>
<div id="content"></div></section>
<footer>VYPRON • لوحة إدارة</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
